# mpv's on-screen controls in the rice (THEME.md §3), generated by noctalia
# (rice_mpv template) from the wallpaper: one plain bar at the bottom,
# JetBrains Mono, the accent only for the played part of the seek bar.
layout=bottombar
seekbarstyle=bar
seekbarhandlesize=0
deadzonesize=1
hidetimeout=800
fadeduration=150
font=JetBrainsMono Nerd Font
boxalpha=0
background_color={{colors.surface.default.hex}}
title_color={{colors.on_surface.default.hex}}
timecode_color={{colors.on_surface_variant.default.hex}}
buttons_color={{colors.on_surface_variant.default.hex}}
top_buttons_color={{colors.on_surface_variant.default.hex}}
small_buttonsL_color={{colors.on_surface_variant.default.hex}}
small_buttonsR_color={{colors.on_surface_variant.default.hex}}
held_element_color={{colors.on_surface.default.hex}}
hover_effect_color={{colors.on_surface.default.hex}}
seekbarfg_color={{colors.primary.default.hex}}
seekbarbg_color={{colors.outline_variant.default.hex}}
seekbar_cache_color={{colors.surface_container_high.default.hex}}
