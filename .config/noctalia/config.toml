[accessibility]
ui_scale = 1.20

[bar.default]
# Off: the rice's own minimal bar replaces it (~/.config/quickshell/rice).
# Set back to true to bring noctalia's bar back.
enabled = false
center = [ "workspaces", "spacer_1", "active_window" ]
concave_edge_corners = true
end = [ "media", "spacer_1", "tray", "notifications", "network", "volume", "session" ]
margin_edge = 0
margin_ends = 0
radius_bottom_left = 12
radius_bottom_right = 12
radius_top_left = 0
radius_top_right = 0
scale = 1.10
start = [ "launcher", "clock", "spacer_1", "group:g1" ]
thickness = 35

    [[bar.default.capsule_group]]
    border = ""
    fill = "on_secondary"
    id = "g1"
    members = [ "temp", "sysmon_2", "sysmon_3" ]
    opacity = 1.0
    padding = 6.0

[shell]
clipboard_image_action_command = "swash --stdin --name \"swash-$(date +'%Y-%m-%d_%H:%M:%S').png\""
launch_apps_as_systemd_services = true
polkit_agent = true
settings_show_advanced = true

# The rice's minimal style (THEME.md §3) for every noctalia page and panel:
# square corners, the rice's mono font, outlines instead of shadows.
corner_radius_scale = 0.0
font_family = "JetBrainsMono Nerd Font"
button_borders = true
card_borders = true
input_borders = true
popup_borders = true
popup_shadows = false

    [shell.greeter_sync]
    auto_sync = false    # the rice's own greeter syncs through the rice_greeter template

    [shell.panel]
    open_near_click_control_center = true
    session_placement = "floating"
    session_position = "center"
    # minimal style: one plain 2px outline, solid, no shadow
    borders = true
    border_width = 2.0
    border_color = "on_surface_variant"
    shadow = false
    transparency_mode = "solid"

    [shell.screenshot]
    copy_to_clipboard = false
    pipe_command = "swash --stdin --name \"swash-$(date +'%Y-%m-%d_%H:%M:%S').png\""
    pipe_to_command = true
    save_to_file = false

    [[shell.session.actions]]
    action = "lock"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "lock_and_suspend"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "4"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 3.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

[system.monitor]
gpu_poll_seconds = 2

[theme]
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-tonal-spot"   # calm palette; "vibrant" was tried and was too strong

[theme.templates]
# Terminals (kitty, alacritty, btop) keep the fixed minimal palette: not listed here.
builtin_ids = [ "gtk3", "gtk4", "kcolorscheme", "qt" ]
# Obsidian: CSS snippet in each vault.
enable_community_templates = true
community_ids = [ "obsidian", "zed" ]

[widget.clock]
color = "secondary"
format = "{:%H:%M %A %m/%d/%y}"

[widget.launcher]
color = "secondary"

[widget.media]
hide_when_no_media = true
title_scroll = "on_hover"

[widget.network]
color = "secondary"

[widget.notifications]
color = "secondary"

[widget.session]
color = "error"

[widget.spacer_1]
type = "spacer"

[widget.temp]
show_value = false

[widget.sysmon_2]
glyph = "gpu-usage"
show_value = false
stat = "gpu_temp"
type = "sysmon"

[widget.sysmon_3]
glyph = "cpu-2"
stat = "ram_used"
type = "sysmon"

[widget.tray]
capsule = true
capsule_fill = "on_secondary"

[widget.volume]
color = "secondary"

[widget.workspaces]
active_pill_size = 2.5
capsule = true
capsule_fill = "on_primary"
inactive_pill_size = 1.0
pill_scale = 0.80
show_labels = false

[wallpaper]
enabled             = true
fill_mode           = "crop"    # center | crop | fit | stretch | repeat | span
fill_color          = "#111111" # optional fallback/fill color; image wallpapers take priority
transition          = ["fade", "wipe"]
                                # array of effects picked at random each transition
                                # omit to use all effects
transition_duration = 1500 # milliseconds
edge_smoothness     = 0.3       # 0.0 – 1.0
transition_on_startup = false   # animate the first wallpaper at shell startup (v4-style)

# Directory browsed by the wallpaper picker panel. Leave empty to use the
# standard XDG Pictures directory (from `XDG_PICTURES_DIR` or `user-dirs.dirs`).
directory           = "/home/aprakash/Wallpapers"
# Theme-aware directories (used when theme mode is Light/Dark; Auto falls back to directory)
# Enable per-monitor directory overrides (default: false)
per_monitor_directories = false

[wallpaper.default]
path = "/home/aprakash/Wallpapers/default.png"

[wallpaper.automation]
enabled                      = true
interval_seconds             = 1800
order                        = "random" # random | alphabetical
recursive                    = false    # scan subdirectories when selecting random wallpapers (default: false)

# Per-monitor overrides - same match rules as bar monitor overrides
# Only active when per_monitor_directories = true
[wallpaper.monitor.DP-2]
enabled         = false
fill_color      = "#202020"
directory       = "/home/user/Wallpapers/Vertical"
