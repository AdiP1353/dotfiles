# Launcher setups (THEME.md §5): open the launcher (SUPER + Space), type "/"
# and a setup's name, press Enter. Edit this file any time; the launcher
# re-reads it on its own. "/edit" in the launcher opens it.
#
# One block per setup:
#   [name]               what you type after "/"
#   about = ...          shown next to it in the launcher
#   go = 4               the workspace you end up on (default: the first one listed)
#   <workspace> = <app>  open <app> on that workspace; one line per app, as many
#                        as you like, several apps on one workspace is fine
#     <app> is an app as the launcher knows it: its name or desktop id
#           (firefox, obsidian, claude, zed, discord, spotify...), or
#           "$ <command>" for any command, e.g.  2 = $ kitty -e btop
# Apps that are already open are moved to their workspace, not opened twice.

[study]
about = firefox, obsidian and claude
go = 4
1 = firefox
3 = claude
4 = obsidian

[code]
about = zed, a terminal and claude
go = 5
5 = zed
5 = $ kitty
3 = claude

[chill]
about = spotify and discord
go = 2
2 = spotify
6 = discord
