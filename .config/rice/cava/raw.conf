# cava for the rice's visualisers (quickshell/rice/Cava.qml): no picture of
# its own, just numbers. 192 bars, each 0-100, one frame per line, ";" between.
[general]
framerate = 60
bars = 192
autosens = 1
# 40 Hz - 16 kHz: with cava's default 10 kHz top, treble (cymbals, "s"
# sounds) folded back into the middle bars; tested with pure tones.
lower_cutoff_freq = 40
higher_cutoff_freq = 16000
sleep_timer = 2

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10
channels = mono

[smoothing]
# 25: measured against the playing song, 70 put the bass ~330 ms behind the
# beat; 25 keeps it ~150 ms behind without the bars flickering.
noise_reduction = 25
