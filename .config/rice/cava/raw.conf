# cava for the rice's visualisers (quickshell/rice/Cava.qml): no picture of
# its own, just numbers. 192 bars, each 0-100, one frame per line, ";" between.
[general]
framerate = 60
bars = 192
autosens = 1
sleep_timer = 2

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 100
bar_delimiter = 59
frame_delimiter = 10
channels = mono

[smoothing]
noise_reduction = 70
