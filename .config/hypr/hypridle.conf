# Idle (hypridle), THEME.md §5: dim at 4 minutes, lock at 5 (the rice lock
# screen), sleep at 15. Video players, browsers playing video and fullscreen
# windows (games) keep it awake, and so does "awake" in the bar (noctalia's
# idle inhibitor).
general {
    lock_cmd = ~/.config/rice-greeter/lock.sh       # does nothing if already locked
    # The rice lock directly, never `loginctl lock-session`: noctalia listens for
    # that signal and would show its own lock screen on top.
    before_sleep_cmd = ~/.config/rice-greeter/lock.sh   # lock before the laptop sleeps
    inhibit_sleep = 3                                  # ...and wait until it is locked
    ignore_dbus_inhibit = false
}

listener {
    timeout = 240
    on-timeout = brightnessctl -s set 30%
    on-resume = brightnessctl -r
}

listener {
    timeout = 300
    on-timeout = ~/.config/rice-greeter/lock.sh
}

listener {
    timeout = 900
    on-timeout = systemctl suspend
}
