# Minimal terminal (THEME.md §3): one fixed palette, block cursor, the
# rice's font, no effects. It does not follow the wallpaper.

font_family                 JetBrainsMono Nerd Font
font_size                   12

background_opacity          0.92
window_padding_width        16

cursor_shape                block
cursor_blink_interval       0.53
cursor_trail                0

# Tabs as plain lowercase text, like the rest of the rice
tab_bar_style               separator
tab_separator               "   "
tab_title_template          "{index} {title.lower()}"
active_tab_font_style       normal
inactive_tab_font_style     normal

enable_audio_bell           no

include themes/rice-minimal.conf

map ctrl+0 change_font_size all 0
